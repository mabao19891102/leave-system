{% extends "base.html" %}
{% block title %}权限管理{% endblock %}
{% block content %}
<div class="page-header">
    <h1>🔐 权限管理</h1>
    <p class="text-muted">管理员工角色 · 设置审批抄送人</p>
</div>

<div class="toolbar">
    <span style="font-size:13px;color:var(--text-muted);">
        <span class="tag tag-blue">admin</span> 超级管理员
        <span class="tag tag-orange">approver</span> 审批人
        <span class="tag tag-green">employee</span> 普通员工
        <span class="tag tag-gray">viewer</span> 只读查看
    </span>
</div>

<div class="card" style="margin-bottom:16px;">
    <div class="card-header"><h2>📋 员工角色设置</h2></div>
    <div class="card-body p-0">
        <div class="table-scroll">
            <table class="table report-table">
                <thead>
                    <tr>
                        <th>姓名</th><th>编号</th><th>学历</th><th>岗位</th><th>当前角色</th><th style="width:140px;">新角色</th>
                    </tr>
                </thead>
                <tbody id="roleBody">
                    <tr><td colspan="6" class="text-center">加载中...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="card">
    <div class="card-header"><h2>✉️ 审批抄送设置</h2></div>
    <div class="card-body">
        <p style="font-size:13px;color:#8899a6;">审批通过后，自动抄送以下老师（该老师仅可查看余额明细）</p>
        <div style="display:flex;align-items:center;gap:10px;margin-top:10px;">
            <select id="ccSelect" class="form-select" style="max-width:300px;">
                <option value="">-- 不抄送 --</option>
            </select>
            <button class="btn btn-primary" onclick="saveCc()">💾 保存</button>
            <span id="ccResult" style="font-size:13px;"></span>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadRoles() {
    const res = await fetch('/api/admin/roles');
    const data = await res.json();
    const tbody = document.getElementById('roleBody');
    tbody.innerHTML = data.filter(e => e.name !== '马文兵').map(e => {
        const roles = ['employee','approver','viewer'];
        const labels = {'employee':'👤 员工','approver':'✅ 审批人','viewer':'👁 查看者'};
        return `<tr>
            <td><strong>${e.name}</strong></td>
            <td>${e.employee_id}</td>
            <td>${e.education || '-'}</td>
            <td>${e.position_status || '-'}</td>
            <td><span class="tag tag-${e.role === 'approver' ? 'orange' : e.role === 'viewer' ? 'gray' : 'green'}">${labels[e.role] || '👤 员工'}</span></td>
            <td>
                <select class="form-select" style="padding:4px 8px;font-size:12px;" onchange="updateRole(${e.id}, this.value)">
                    ${roles.map(r => `<option value="${r}" ${e.role === r ? 'selected' : ''}>${labels[r]}</option>`).join('')}
                </select>
            </td>
        </tr>`;
    }).join('');

    // Load CC select
    const ccSel = document.getElementById('ccSelect');
    data.forEach(e => {
        if (e.name !== '马文兵') {
            ccSel.innerHTML += `<option value="${e.id}">${e.name}</option>`;
        }
    });
    // Get current CC
    const ccRes = await fetch('/api/admin/get-cc');
    const ccData = await ccRes.json();
    if (ccData.viewer) {
        ccSel.value = ccData.viewer.id;
    }
}

async function updateRole(empId, role) {
    const res = await fetch('/api/admin/update-role', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({employee_id: empId, role: role})
    });
    const data = await res.json();
    if (data.success) {
        loadRoles();
    } else {
        alert(data.error);
    }
}

async function saveCc() {
    const val = document.getElementById('ccSelect').value;
    const res = await fetch('/api/admin/set-cc', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({viewer_id: val})
    });
    const data = await res.json();
    document.getElementById('ccResult').textContent = data.success ? '✅ 已保存' : '❌ ' + data.error;
    setTimeout(() => document.getElementById('ccResult').textContent = '', 3000);
}

loadRoles();
</script>
{% endblock %}
