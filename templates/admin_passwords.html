{% extends "base.html" %}
{% block title %}密码管理{% endblock %}
{% block content %}
<div class="page-header">
    <h1>🔐 密码管理</h1>
    <p class="text-muted">查看所有员工密码（仅管理员可见）</p>
</div>

<div class="card">
    <div class="card-header">
        <h2>👥 员工密码列表</h2>
        <span class="chart-badge" id="pwCount">0人</span>
    </div>
    <div class="card-body p-0">
        <div class="table-scroll">
            <table class="table report-table">
                <thead><tr><th>姓名</th><th>编号</th><th>密码</th><th>角色</th><th>操作</th></tr></thead>
                <tbody id="pwBody"><tr><td colspan="5" class="text-center">加载中...</td></tr></tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function loadPasswords() {
    const res = await fetch('/api/admin/passwords');
    const data = await res.json();
    document.getElementById('pwCount').textContent = data.length + '人';
    const roles = {'admin':'超级管理员','approver':'审批人','viewer':'查看者','employee':'员工'};
    document.getElementById('pwBody').innerHTML = data.map(e => '<tr>' +
        '<td><strong>' + e.name + '</strong></td>' +
        '<td>' + e.employee_id + '</td>' +
        '<td><code style="background:rgba(255,255,255,0.06);padding:2px 8px;border-radius:4px;color:#fbbf24;font-size:13px;">' + e.password + '</code></td>' +
        '<td>' + (roles[e.role] || e.role) + '</td>' +
        '<td><button class="btn btn-sm btn-outline" onclick="resetPw(' + e.employee_id + ',\'' + e.name + '\')">🔄 重置</button></td>' +
        '</tr>').join('');
}

async function resetPw(empId, name) {
    if (!confirm('确定要重置 ' + name + ' 的密码为编号(' + empId + ')吗？')) return;
    const res = await fetch('/api/change-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({old_password: '', new_password: String(empId), reset_for: name})
    });
    // Use admin reset API instead
    const res2 = await fetch('/api/admin/reset-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({employee_id: empId, name: name})
    });
    const data = await res2.json();
    if (data.success) {
        loadPasswords();
    } else {
        alert(data.error || '重置失败');
    }
}

loadPasswords();
</script>
{% endblock %}
