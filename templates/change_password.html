{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block content %}
<div class="page-header">
    <h1>🔑 修改密码</h1>
    <p class="text-muted">修改登录密码，请妥善保管</p>
</div>

<div class="card" style="max-width:400px;margin:0 auto;">
    <div class="card-body" style="padding:24px;">
        <div class="form-group">
            <label>当前用户</label>
            <div style="font-size:16px;font-weight:600;color:#c8d0ff;padding:8px 0;">{{ session.get('user', '') }}</div>
        </div>
        <div class="form-group">
            <label>原密码</label>
            <input type="password" id="oldPw" class="form-input" placeholder="输入原密码" style="width:100%;">
        </div>
        <div class="form-group mt-3">
            <label>新密码</label>
            <input type="password" id="newPw" class="form-input" placeholder="至少4位" style="width:100%;">
        </div>
        <div class="form-group mt-3">
            <label>确认新密码</label>
            <input type="password" id="confirmPw" class="form-input" placeholder="再次输入新密码" style="width:100%;">
        </div>
        <button class="btn btn-primary mt-3" onclick="doChange()" style="width:100%;">🔑 修改密码</button>
        <div id="pwResult" class="mt-3"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
async function doChange() {
    const old = document.getElementById('oldPw').value;
    const newPw = document.getElementById('newPw').value;
    const confirm = document.getElementById('confirmPw').value;
    const result = document.getElementById('pwResult');

    if (!old || !newPw || !confirm) { result.innerHTML = '<div class="error-msg">请填写完整</div>'; return; }
    if (newPw !== confirm) { result.innerHTML = '<div class="error-msg">两次密码不一致</div>'; return; }
    if (newPw.length < 4) { result.innerHTML = '<div class="error-msg">新密码至少4位</div>'; return; }

    const res = await fetch('/api/change-password', {
        method: 'POST',
        headers: {'Content-Type':'application/json'},
        body: JSON.stringify({old_password: old, new_password: newPw})
    });
    const data = await res.json();
    if (data.success) {
        result.innerHTML = '<div class="success-msg">✅ 密码修改成功！</div>';
        document.getElementById('oldPw').value = '';
        document.getElementById('newPw').value = '';
        document.getElementById('confirmPw').value = '';
    } else {
        result.innerHTML = '<div class="error-msg">❌ ' + (data.error || '修改失败') + '</div>';
    }
}
</script>
<style>
.form-input { padding:10px 12px; border:1px solid rgba(255,255,255,0.1); border-radius:8px; background:rgba(255,255,255,0.04); color:#c0cce0; font-size:14px; }
.form-input:focus { outline:none; border-color:#667eea; }
.error-msg { color:#ff4757; font-size:13px; padding:8px 12px; background:rgba(255,71,87,0.1); border-radius:6px; }
.success-msg { color:#34d399; font-size:13px; padding:8px 12px; background:rgba(52,211,153,0.1); border-radius:6px; }
</style>
{% endblock %}
