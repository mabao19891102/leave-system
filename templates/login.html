<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>药事管理组 - 假期管理系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }
        .login-card {
            background: white; border-radius: 16px; padding: 40px; width: 400px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .login-card h1 { font-size: 24px; text-align: center; margin-bottom: 8px; color: #333; }
        .login-card .subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 6px; color: #555; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px;
            font-size: 14px; transition: border-color 0.2s;
        }
        .form-group input:focus { outline: none; border-color: #667eea; box-shadow: 0 0 0 3px rgba(102,126,234,0.1); }
        .btn-primary {
            width: 100%; padding: 12px; background: #667eea; color: white; border: none;
            border-radius: 8px; font-size: 16px; cursor: pointer; transition: background 0.2s;
        }
        .btn-primary:hover { background: #5a6fd6; }
        .error { background: #fff0f0; color: #e74c3c; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 13px; text-align: center; }
        .login-hint { text-align: center; margin-top: 20px; color: #aaa; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>西安交大一附院</h1>
        <p class="subtitle">药事管理组 · 假期管理系统</p>
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" placeholder="管理员: admin / 员工: 姓名" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" placeholder="管理员: admin123 / 员工: 职工编号" required>
            </div>
            <button type="submit" class="btn-primary">登 录</button>
        </form>
        <p class="login-hint">管理员: admin / admin123<br>员工: 用姓名登录，密码为职工编号（如 王亚奇 / 004178）</p>
    </div>
</body>
</html>
